<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posiciones de Clientes — Equanima</title>
<style>
  :root {
    --bg: #10151a;
    --bg-card: #16211c;
    --bg-card2: #1c2a23;
    --border: #24352c;
    --text: #eef1f6;
    --muted: #93a39a;
    --accent: #3ecf8e;
    --green: #3ecf8e;
    --red: #ff5c5c;
    --sidebar-w: 220px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  select, input, button {
    background: var(--bg-card2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 14px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }

  #app { display: none; min-height: 100vh; }

  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: #0c1210;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px 0;
  }
  .sidebar .brand { padding: 0 20px 20px; }
  .sidebar .brand b { font-size: 17px; display: block; }
  .sidebar .brand span { color: var(--muted); font-size: 12px; }
  .sidebar nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .navbtn {
    background: none; border: none; border-radius: 0;
    text-align: left; padding: 10px 20px; color: var(--muted);
    font-size: 14px; cursor: pointer;
  }
  .navbtn:hover { background: var(--bg-card2); color: var(--text); }
  .navbtn.active { background: var(--bg-card2); color: var(--accent); border-left: 3px solid var(--accent); padding-left: 17px; }
  .sidebar .bottom { padding: 0 20px; }
  .sidebar .bottom button { width: 100%; }

  .content { flex: 1; min-width: 0; }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 10px;
  }
  .topbar .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  #fecha { color: var(--muted); font-size: 13px; text-transform: capitalize; }
  #selectorWrap { display: flex; align-items: center; gap: 12px; }

  main { padding: 20px 24px; max-width: 1200px; }
  .view { display: none; }
  h2 { font-size: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 12px; }
  h3 { font-size: 15px; margin: 0 0 10px; }
  h4 { margin: 0 0 10px; font-size: 14px; }

  .panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    gap: 12px;
    align-items: center;
  }
  .row:last-child { border-bottom: none; }
  .row.neg b { color: var(--red); }
  .row.pos b { color: var(--text); }
  .neg { color: var(--red); }
  .pos { color: var(--green); }
  .muted { color: var(--muted); }
  .alerta {
    margin-top: 10px;
    background: rgba(255,92,92,0.1);
    border: 1px solid var(--red);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
  }

  .stats-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    flex: 1;
    min-width: 180px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .stat-card.warn { border-color: var(--red); }
  .stat-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  .stat-value { font-size: 22px; font-weight: 700; }
  .stat-value.neg { color: var(--red); }
  .stat-value.pos { color: var(--green); }
  .stat-sub { color: var(--muted); font-size: 12px; }

  .caucion-grid { display: flex; gap: 16px; flex-wrap: wrap; }
  .caucion-box {
    background: var(--bg-card2);
    border: 1px solid var(--red);
    border-radius: 10px;
    padding: 16px;
    flex: 1;
    min-width: 260px;
  }

  .dist-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; }
  .dist-label { width: 90px; flex-shrink: 0; }
  .dist-bar-wrap { flex: 1; background: var(--bg-card2); border-radius: 4px; height: 10px; overflow: hidden; }
  .dist-bar { height: 100%; background: var(--accent); }
  .dist-pct { width: 55px; text-align: right; color: var(--muted); flex-shrink: 0; }
  .two-col { display: flex; gap: 16px; flex-wrap: wrap; }
  .two-col > .panel { flex: 1; min-width: 280px; }

  .periodo-tabs, .moneda-toggle { display: flex; gap: 6px; margin-bottom: 16px; }
  .periodo-btn { background: var(--bg-card); }
  .periodo-btn.active { background: var(--accent); color: #06140d; border-color: var(--accent); font-weight: 600; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left;
    background: var(--bg-card2);
    padding: 8px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td, tfoot td {
    padding: 6px 8px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  tfoot td { font-weight: bold; border-top: 1px solid var(--border); }
  tbody input {
    width: 90px;
    padding: 4px 6px;
    font-size: 13px;
  }
  .table-wrap { overflow-x: auto; }

  #login {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    flex-direction: column;
    gap: 12px;
  }
  #login .box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 30px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 280px;
  }
  #loginError { color: var(--red); font-size: 13px; min-height: 16px; }
  .fila-caucion td:nth-child(2) { color: var(--red); }
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h3>Posiciones de Clientes</h3>
    <input type="password" id="passInput" placeholder="Contraseña">
    <button id="btnLogin">Ingresar</button>
    <div id="loginError"></div>
  </div>
</div>

<div id="app">
  <aside class="sidebar">
    <div class="brand"><b>Equanima</b><span>Posiciones de Clientes</span></div>
    <nav>
      <button class="navbtn" data-view="general">General</button>
      <button class="navbtn" data-view="dashboardCliente">Dashboard</button>
      <button class="navbtn" data-view="posiciones">Posiciones</button>
      <button class="navbtn" data-view="rendimiento">Rendimiento</button>
      <button class="navbtn" data-view="cauciones">Cauciones</button>
      <button class="navbtn" data-view="carry">Carry Trade</button>
      <button class="navbtn" data-view="comitentes">Comitentes</button>
    </nav>
    <div class="bottom">
      <button id="btnLogout">Salir</button>
    </div>
  </aside>

  <div class="content">
    <div class="topbar">
      <span id="fecha"></span>
      <div class="controls">
        <div id="selectorWrap">
          <select id="comitenteSelect"></select>
        </div>
        <button id="btnExportar">Exportar estado (JSON)</button>
      </div>
    </div>

    <main>
      <div class="view" id="view-general"></div>
      <div class="view" id="view-dashboardCliente"></div>
      <div class="view" id="view-posiciones"></div>
      <div class="view" id="view-rendimiento"></div>
      <div class="view" id="view-cauciones"></div>
      <div class="view" id="view-carry"></div>
      <div class="view" id="view-comitentes"></div>
    </main>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
