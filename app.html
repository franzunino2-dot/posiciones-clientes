<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posiciones de Clientes — Equanima</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1220;
    --bg-card: #111b2d;
    --bg-card2: #16233a;
    --border: #1d2b44;
    --text: #e8eef9;
    --muted: #8a9bb8;
    --accent: #0ea5e9;
    --green: #2dd4a0;
    --red: #ff6b6b;
    --sidebar-w: 250px;
    --serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  select, input, button {
    background: var(--bg-card2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 14px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }

  #app { display: none; min-height: 100vh; }

  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: #09101e;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px 0;
  }
  .sidebar { position: sticky; top: 0; height: 100vh; }
  .sidebar .brand { padding: 0 20px 18px; }
  .sidebar .brand b { font-family: var(--serif); font-weight: 400; font-size: 32px; display: block; letter-spacing: -.01em; }
  .sidebar .brand b i { color: var(--accent); }
  .sidebar .brand span { color: var(--muted); font-size: 12px; }
  .sidebar nav { display: flex; flex-direction: column; gap: 4px; flex: 1; padding: 0 10px; overflow-y: auto; }
  .navbtn {
    display: flex; align-items: center; gap: 12px;
    background: none; border: none; border-radius: 10px;
    text-align: left; padding: 10px 12px; color: var(--text);
    font-size: 14px; font-weight: 500; cursor: pointer; width: 100%;
  }
  .navbtn svg, .navgroup svg { width: 18px; height: 18px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .navbtn.sub { margin-left: 14px; width: calc(100% - 14px); color: var(--muted); font-weight: 400; padding: 9px 12px; }
  .navbtn:hover { background: var(--bg-card2); color: var(--text); border-color: transparent; }
  .navbtn.active { background: #0f2a45; color: var(--accent); }
  .navgroup { display: flex; align-items: center; gap: 12px; padding: 10px 12px; font-size: 14px; font-weight: 600; border-radius: 10px; }
  .navgroup.open { background: #0f2036; }
  .navsep { height: 1px; background: var(--border); margin: 8px 6px; }
  .sidebar .bottom { padding: 12px 20px 0; border-top: 1px solid var(--border); }
  .sidebar .bottom button { width: 100%; }

  .ticker { display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--border); background: #0a111f; height: 38px; overflow: hidden; }
  .ticker-track { flex: 1; overflow: hidden; white-space: nowrap; mask-image: linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent); }
  .ticker-move { display: inline-flex; gap: 34px; padding-left: 20px; animation: tick 60s linear infinite; }
  .ticker-track:hover .ticker-move { animation-play-state: paused; }
  @keyframes tick { to { transform: translateX(-50%); } }
  .tk { font-size: 12px; display: inline-flex; gap: 8px; align-items: baseline; }
  .tk .n { color: var(--muted); letter-spacing: .04em; }
  .tk .v { font-weight: 600; }
  .mkt-badges { display: flex; gap: 8px; padding-right: 14px; flex-shrink: 0; }
  .mkt { font-size: 11px; border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; color: var(--muted); white-space: nowrap; }
  .mkt::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .mkt.open { color: var(--green); border-color: rgba(45,212,160,.3); background: rgba(45,212,160,.08); }
  .mkt.open::before { background: var(--green); }

  .hero-title { font-family: var(--serif); font-weight: 400; font-size: 48px; line-height: 1.08; margin: 6px 0 22px; letter-spacing: -.01em; max-width: 1000px; }
  .hero-title .soft { color: #b7c3d8; }
  .hero-title em { color: var(--accent); }
  .hero-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 32px; display: grid; grid-template-columns: 1.15fr 1fr; gap: 28px; margin-bottom: 20px; }
  .hero-card .pill { display: inline-flex; align-items: center; gap: 8px; background: #0f2a45; color: var(--accent); border-radius: 999px; padding: 5px 12px; font-size: 12px; margin-bottom: 18px; }
  .hero-card .pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .hero-big { font-family: var(--serif); font-size: 52px; line-height: 1.05; margin: 0 0 8px; letter-spacing: -.01em; }
  .hero-big em { color: var(--accent); }
  .hero-sub { color: #c4cee0; font-size: 15px; margin: 0 0 22px; }
  .btn-primary { background: var(--accent); color: #04121c; border: none; border-radius: 999px; padding: 12px 22px; font-weight: 600; font-size: 14px; }
  .btn-primary:hover { filter: brightness(1.1); border: none; }
  .hero-chips { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 22px; color: var(--muted); font-size: 12px; }
  .hero-chips span::before { content: '✓'; color: var(--green); margin-right: 6px; }
  .mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-content: start; }
  .mini { background: var(--bg-card2); border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .mini .stat-label { text-transform: none; font-size: 12px; letter-spacing: 0; }
  .mini b { font-size: 20px; }
  .mini.warn { border-color: rgba(255,107,107,.5); }
  @media (max-width: 1100px) { .hero-card { grid-template-columns: 1fr; } .hero-title { font-size: 36px; } }

  .content { flex: 1; min-width: 0; }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 10px;
  }
  .topbar .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  #fecha { color: var(--muted); font-size: 13px; text-transform: capitalize; }
  #selectorWrap { display: flex; align-items: center; gap: 12px; }

  main { padding: 20px 24px; max-width: 1200px; }
  .view { display: none; }
  h2 { font-size: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 12px; }
  h3 { font-size: 15px; margin: 0 0 10px; }
  h4 { margin: 0 0 10px; font-size: 14px; }

  .panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    gap: 12px;
    align-items: center;
  }
  .row:last-child { border-bottom: none; }
  .row.neg b { color: var(--red); }
  .row.pos b { color: var(--text); }
  .neg { color: var(--red); }
  .pos { color: var(--green); }
  .muted { color: var(--muted); }
  .alerta {
    margin-top: 10px;
    background: rgba(255,92,92,0.1);
    border: 1px solid var(--red);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
  }

  .stats-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    flex: 1;
    min-width: 180px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .stat-card.warn { border-color: var(--red); }
  .stat-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  .stat-value { font-size: 22px; font-weight: 700; }
  .stat-value.neg { color: var(--red); }
  .stat-value.pos { color: var(--green); }
  .stat-sub { color: var(--muted); font-size: 12px; }

  .caucion-grid { display: flex; gap: 16px; flex-wrap: wrap; }
  .caucion-box {
    background: var(--bg-card2);
    border: 1px solid var(--red);
    border-radius: 10px;
    padding: 16px;
    flex: 1;
    min-width: 260px;
  }

  .dist-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; }
  .dist-label { width: 90px; flex-shrink: 0; }
  .dist-bar-wrap { flex: 1; background: var(--bg-card2); border-radius: 4px; height: 10px; overflow: hidden; }
  .dist-bar { height: 100%; background: var(--accent); }
  .dist-pct { width: 55px; text-align: right; color: var(--muted); flex-shrink: 0; }
  .two-col { display: flex; gap: 16px; flex-wrap: wrap; }
  .two-col > .panel { flex: 1; min-width: 280px; }

  .barchart { display: flex; align-items: flex-end; gap: 4px; height: 180px; overflow-x: auto; padding-top: 10px; }
  .barcol { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; flex: 0 0 auto; width: 28px; height: 100%; }
  .barwrap { flex: 1; display: flex; align-items: flex-end; width: 100%; }
  .bar { width: 100%; border-radius: 2px 2px 0 0; }
  .pos-bar { background: var(--green); }
  .neg-bar { background: var(--red); }
  .barlabel { font-size: 10px; color: var(--muted); margin-top: 4px; white-space: nowrap; }

  .periodo-tabs, .moneda-toggle { display: flex; gap: 6px; margin-bottom: 16px; }
  .periodo-btn { background: var(--bg-card); }
  .periodo-btn.active { background: var(--accent); color: #04121c; border-color: var(--accent); font-weight: 600; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left;
    background: var(--bg-card2);
    padding: 8px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td, tfoot td {
    padding: 6px 8px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  tfoot td { font-weight: bold; border-top: 1px solid var(--border); }
  tbody input {
    width: 90px;
    padding: 4px 6px;
    font-size: 13px;
  }
  .table-wrap { overflow-x: auto; }

  #login {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    flex-direction: column;
    gap: 12px;
  }
  #login .box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 30px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 280px;
  }
  #loginError { color: var(--red); font-size: 13px; min-height: 16px; }
  .fila-caucion td:nth-child(2) { color: var(--red); }

  /* ---------- Vista del comitente (tema claro, simple) ---------- */
  #clienteApp { display: none; min-height: 100vh; background: #f4f6fa; color: #0f1b2d; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  #clienteApp button { background: none; border: none; color: inherit; font: inherit; padding: 0; border-radius: 0; cursor: pointer; }
  #clienteApp button:hover { border: none; }
  #clienteApp button:disabled { opacity: .35; cursor: not-allowed; }
  .cv-staff { background: #0f2a45; color: #cfe8f8; font-size: 13px; padding: 8px 20px; text-align: center; }
  .cv-staff button { color: #7dd3fc !important; font-weight: 600; margin-left: 8px; }
  .cv-head { display: flex; align-items: center; gap: 28px; padding: 14px 28px; background: #fff; border-bottom: 1px solid #e5e9f0; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
  .cv-brand { font-family: var(--serif); font-size: 28px; letter-spacing: -.01em; }
  .cv-brand i { color: #0ea5e9; }
  .cv-tabs { display: flex; gap: 6px; flex: 1; }
  .cv-tabs button { padding: 8px 16px !important; border-radius: 999px !important; font-size: 14px; font-weight: 500; color: #5b6b82; }
  .cv-tabs button:hover { background: #eef2f7; }
  .cv-tabs button.on { background: #e0f2fe; color: #0369a1; font-weight: 600; }
  .cv-right { display: flex; align-items: center; gap: 14px; }
  .cv-mon { display: flex; background: #eef2f7; border-radius: 999px; padding: 3px; }
  .cv-mon button { padding: 6px 14px !important; border-radius: 999px !important; font-size: 13px; font-weight: 500; color: #5b6b82; }
  .cv-mon button.on { background: #fff; color: #0f1b2d; font-weight: 600; box-shadow: 0 1px 3px rgba(15,27,45,.12); }
  .cv-salir { font-size: 13px; color: #5b6b82 !important; }
  .cv-main { max-width: 1080px; margin: 0 auto; padding: 28px 20px 20px; }
  .cv-hola { font-family: var(--serif); font-size: 34px; margin-bottom: 16px; }
  .cv-resumen { background: #fff; border: 1px solid #e5e9f0; border-radius: 18px; padding: 26px 30px; display: flex; gap: 60px; flex-wrap: wrap; margin-bottom: 18px; }
  .cv-etq { font-size: 13px; color: #6b7a90; }
  .cv-total { font-family: var(--serif); font-size: 52px; line-height: 1.1; letter-spacing: -.01em; }
  .cv-saldo { font-size: 26px; font-weight: 600; margin: 6px 0 2px; }
  .cv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
  .cv-grid-port { grid-template-columns: 1.1fr 1fr; }
  .cv-grid-cal { grid-template-columns: 1.6fr 1fr; align-items: start; }
  .cv-card { background: #fff; border: 1px solid #e5e9f0; border-radius: 18px; padding: 22px 24px; margin-bottom: 18px; }
  .cv-grid .cv-card { margin-bottom: 0; }
  .cv-card-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .cv-card-h h3 { font-size: 17px; margin: 0; font-weight: 600; }
  .cv-link { color: #0369a1 !important; font-size: 13px; font-weight: 600; }
  .cv-fila { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid #eef1f6; }
  .cv-fila:last-child { border-bottom: none; }
  .cv-fila b { font-weight: 600; }
  .cv-fila > div:first-child b, .cv-fila > div:first-child .cv-sub { display: block; }
  .cv-der { text-align: right; }
  .cv-der .cv-sub { display: block; }
  .cv-sub { color: #6b7a90; font-size: 12px; font-weight: 400; display: block; }
  .cv-verde { color: #0f9d6c; }
  .cv-rojo { color: #d94a4a; }
  .cv-vacio { color: #6b7a90; font-size: 14px; padding: 12px 0; margin: 0; }
  .cv-nota { color: #6b7a90; font-size: 12px; margin: 14px 0 0; line-height: 1.5; }
  .cv-sep { height: 1px; background: #e5e9f0; margin: 6px 0; }
  .cv-tot { font-size: 16px; }
  .cv-tabla { overflow-x: auto; }
  #clienteApp table { width: 100%; border-collapse: collapse; font-size: 14px; }
  #clienteApp thead th { background: none; color: #6b7a90; font-weight: 500; font-size: 12px; padding: 8px 10px; border-bottom: 1px solid #e5e9f0; text-align: left; }
  #clienteApp tbody td { padding: 12px 10px; border-bottom: 1px solid #eef1f6; vertical-align: middle; }
  #clienteApp td.n, #clienteApp th.n { text-align: right; white-space: nowrap; }
  #clienteApp tr.cv-saldo-fila td { background: #f8fafc; }
  .cv-donut-wrap { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; }
  .cv-donut { width: 190px; height: 190px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; }
  .cv-donut > div { width: 120px; height: 120px; border-radius: 50%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .cv-donut b { font-size: 13px; font-weight: 600; padding: 0 6px; }
  .cv-leyenda { list-style: none; padding: 0; margin: 0; flex: 1; min-width: 140px; }
  .cv-leyenda li { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 5px 0; }
  .cv-leyenda li i { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .cv-leyenda li span { margin-left: auto; color: #6b7a90; }
  .cv-nav { display: flex; gap: 6px; }
  .cv-nav button { width: 32px; height: 32px; border-radius: 50% !important; background: #eef2f7 !important; font-size: 18px; line-height: 1; }
  .cv-semana, .cv-mes { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cv-semana span { text-align: center; font-size: 12px; color: #6b7a90; padding: 4px 0 8px; }
  .cv-dia { min-height: 72px; border-radius: 10px; padding: 6px; background: #f8fafc; display: flex; flex-direction: column; gap: 3px; overflow: hidden; }
  .cv-dia.vacio { background: none; }
  .cv-dia.con { background: #f0f9ff; }
  .cv-dia.hoy { outline: 2px solid #0ea5e9; }
  .cv-num { font-size: 12px; color: #6b7a90; }
  .cv-chip { background: #0ea5e9; color: #fff; font-size: 10px; font-weight: 600; border-radius: 5px; padding: 1px 5px; width: fit-content; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .cv-chip.am { background: #0f9d6c; }
  .cv-mas { font-size: 10px; color: #6b7a90; }
  .cv-barras { display: grid; grid-template-columns: repeat(12, 1fr); gap: 8px; height: 150px; align-items: end; }
  .cv-barra { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; border-radius: 8px !important; }
  .cv-barra-v { display: block; width: 100%; background: #bae6fd; border-radius: 6px 6px 0 0; min-height: 0; }
  .cv-barra.on .cv-barra-v { background: #0ea5e9; }
  .cv-barra-l { font-size: 11px; color: #6b7a90; }
  .cv-foot { max-width: 1080px; margin: 10px auto 0; padding: 18px 20px 40px; color: #8493a8; font-size: 11px; line-height: 1.5; }
  @media (max-width: 820px) {
    .cv-grid, .cv-grid-port, .cv-grid-cal { grid-template-columns: 1fr; }
    .cv-head { gap: 12px; padding: 12px 16px; }
    .cv-tabs { order: 3; flex-basis: 100%; }
    .cv-right { margin-left: auto; }
    .cv-total { font-size: 38px; }
    .cv-resumen { gap: 24px; padding: 20px; }
    .cv-dia { min-height: 54px; padding: 4px; }
    .cv-chip { font-size: 9px; padding: 0 3px; }
  }
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h3>Posiciones de Clientes</h3>
    <input type="text" id="emailInput" placeholder="Email o usuario" autocomplete="username">
    <input type="password" id="passInput" placeholder="Contraseña" autocomplete="current-password">
    <button id="btnLogin">Ingresar</button>
    <a href="index.html" class="muted" style="font-size:12px;text-align:center">← Volver al inicio</a>
    <div id="loginError"></div>
    <p class="muted" style="font-size:11px;margin:0">Con el servidor local conectado, el email se valida contra Gallo.</p>
  </div>
</div>

<div id="clienteApp"></div>

<div id="app">
  <aside class="sidebar">
    <div class="brand"><b>equanima<i>.</i></b><span>Tu cartera, en un solo lugar</span></div>
    <nav>
      <button class="navbtn" data-view="alyc" data-alyc-only="1"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Panel ALyC</button>
      <div class="navgroup open"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Inicio</div>
      <button class="navbtn sub" data-view="dashboardCliente"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9h9"/></svg>Cartera</button>
      <button class="navbtn sub" data-view="posiciones"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Posiciones</button>
      <button class="navbtn sub" data-view="rendimiento"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Rendimiento</button>
      <button class="navbtn" data-view="cauciones"><svg viewBox="0 0 24 24"><path d="M3 10l9-6 9 6M5 10v8M10 10v8M14 10v8M19 10v8M3 20h18"/></svg>Cauciones</button>
      <button class="navbtn" data-view="carry"><svg viewBox="0 0 24 24"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>Carry Trade</button>
      <div class="navsep"></div>
      <button class="navbtn" data-view="cargar" data-admin-only="1"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>Cargar archivo</button>
      <button class="navbtn" id="btnVerCliente" data-admin-only="1"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>Ver como cliente</button>
